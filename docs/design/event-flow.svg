<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1000" width="1640" height="1000" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1640" height="1000" fill="#fff"/><text x="820" y="44" font-size="30" text-anchor="middle" fill="#222" font-weight="bold" >owlet, event-driven: nobody asks, things announce</text><text x="820" y="74" font-size="16" text-anchor="middle" fill="#444" font-weight="normal" >Events flow left to right. The only sampling left is at the hardware edge, inside the driver that owns it.</text><text x="170" y="118" font-size="15" text-anchor="middle" fill="#666" font-weight="bold" >HARDWARE</text><text x="460" y="118" font-size="15" text-anchor="middle" fill="#666" font-weight="bold" >DRIVERS  (event sources)</text><text x="820" y="118" font-size="15" text-anchor="middle" fill="#666" font-weight="bold" >EVENT QUEUE + DISPATCH</text><text x="1140" y="118" font-size="15" text-anchor="middle" fill="#666" font-weight="bold" >SUBSCRIBERS  (slots)</text><text x="1470" y="118" font-size="15" text-anchor="middle" fill="#666" font-weight="bold" >PC</text><rect x="40" y="170" width="260" height="100" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="170.0" y="216.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Limit switch</text><text x="170.0" y="238.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >pin changes</text><rect x="330" y="170" width="280" height="100" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="470.0" y="216.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >GPIO interrupt</text><text x="470.0" y="238.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >posts LimitHit</text><polyline points="300,220 330,220" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a333)"/><polyline points="610,220 650,220 650,520 690,520" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="470" y="294" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >LimitHit(axis, end)</text><rect x="40" y="320" width="260" height="100" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="170.0" y="366.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >TMC2209 DIAG pin</text><text x="170.0" y="388.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >rises on a stall</text><rect x="330" y="320" width="280" height="100" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="470.0" y="366.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >GPIO interrupt</text><text x="470.0" y="388.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >posts Stalled</text><polyline points="300,370 330,370" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a333)"/><polyline points="610,370 650,370 650,520 690,520" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="470" y="444" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >Stalled(axis)</text><rect x="40" y="470" width="260" height="100" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="170.0" y="506.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >TMC2209 registers</text><text x="170.0" y="528.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >temperature, shorts,</text><text x="170.0" y="548.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >load: no interrupt</text><rect x="330" y="470" width="280" height="100" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="470.0" y="506.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Driver monitor</text><text x="470.0" y="528.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >reads on a timer, emits</text><text x="470.0" y="548.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >ONLY when something changes</text><polyline points="300,520 330,520" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a333)"/><polyline points="610,520 650,520 650,520 690,520" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="470" y="594" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >FaultChanged(axis, flags)</text><rect x="40" y="620" width="260" height="100" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="170.0" y="666.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Step generator</text><text x="170.0" y="688.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >burst finished</text><rect x="330" y="620" width="280" height="100" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="470.0" y="666.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >StepperAxis</text><text x="470.0" y="688.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >posts Arrived</text><polyline points="300,670 330,670" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a333)"/><polyline points="610,670 650,670 650,520 690,520" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="470" y="744" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >Arrived</text><rect x="40" y="770" width="260" height="100" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="170.0" y="816.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >USB</text><text x="170.0" y="838.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >bytes from the PC</text><rect x="330" y="770" width="280" height="100" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="470.0" y="816.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Serial port</text><text x="470.0" y="838.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >posts LineReceived</text><polyline points="300,820 330,820" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" marker-end="url(#a333)"/><polyline points="610,820 650,820 650,520 690,520" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="470" y="894" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >LineReceived</text><rect x="690" y="400" width="280" height="110" rx="10" fill="#fff3bf" stroke="#333" stroke-width="2.5"/><text x="830.0" y="441.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Event queue</text><text x="830.0" y="463.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >fixed size, no heap,</text><text x="830.0" y="483.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >safe to post from an interrupt</text><rect x="690" y="530" width="280" height="110" rx="10" fill="#fff3bf" stroke="#333" stroke-width="2.5"/><text x="830.0" y="571.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Dispatcher</text><text x="830.0" y="593.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >the run loop hands each event</text><text x="830.0" y="613.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >to whoever connected to it</text><rect x="1010" y="200" width="290" height="110" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="1155.0" y="241.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Motion policy</text><text x="1155.0" y="263.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >Stalled / LimitHit / Fault</text><text x="1155.0" y="283.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >→ stop that axis</text><polyline points="970,585 990,585 990,255 1010,255" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><rect x="1010" y="380" width="290" height="110" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="1155.0" y="431.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Homing</text><text x="1155.0" y="453.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >LimitHit → this is zero</text><polyline points="970,585 990,585 990,435 1010,435" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><rect x="1010" y="560" width="290" height="110" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="1155.0" y="601.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Protocol</text><text x="1155.0" y="623.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >every event → one line</text><text x="1155.0" y="643.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >pushed to the PC: $EVT,…</text><polyline points="970,585 990,585 990,615 1010,615" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><rect x="1010" y="740" width="290" height="110" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="1155.0" y="791.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Activity LED</text><text x="1155.0" y="813.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >Moving / Arrived</text><polyline points="970,585 990,585 990,795 1010,795" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><rect x="1340" y="500" width="260" height="100" rx="10" fill="#fdebd0" stroke="#333" stroke-width="2.5"/><text x="1470.0" y="536.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >owlet client</text><text x="1470.0" y="558.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >turns $EVT lines</text><text x="1470.0" y="578.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >into signals</text><rect x="1340" y="680" width="260" height="100" rx="10" fill="#fdebd0" stroke="#333" stroke-width="2.5"/><text x="1470.0" y="716.0" font-size="17" text-anchor="middle" fill="#222" font-weight="bold" >Your application</text><text x="1470.0" y="738.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >head.stalled.connect(fn)</text><text x="1470.0" y="758.0" font-size="14" text-anchor="middle" fill="#333" font-weight="normal" >no polling loop</text><polyline points="1300,615 1320,615 1320,550 1340,550" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="1470" y="484" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold" >$EVT,STALL,PAN</text><polyline points="1470,600 1470,680" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="820" y="930" font-size="16" text-anchor="middle" fill="#333" font-weight="normal" >Same seams as today: a new motor driver or sensor only has to post its events; a new subscriber only has to connect.</text><text x="820" y="958" font-size="14" text-anchor="middle" fill="#666" font-weight="normal" >Grey = hardware   blue = code that touches hardware   yellow = the one new piece   green = existing logic, now reacting   orange = PC side</text></svg>