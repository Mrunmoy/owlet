[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owlet"
version = "0.4.0"
description = "Client library and CLI for the owlet USB pan-tilt head"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.4"]

[project.scripts]
owlet = "owlet.cli:main"

[tool.setuptools]
packages = ["owlet"]
