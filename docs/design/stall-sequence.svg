<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 820" width="1640" height="820" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="a333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1640" height="820" fill="#fff"/><text x="820" y="44" font-size="28" text-anchor="middle" fill="#222" font-weight="bold" >One stall, end to end: who does what, and in what order</text><text x="820" y="74" font-size="16" text-anchor="middle" fill="#444" font-weight="normal" >Nobody ever asks “are you stalled?”. The driver chip raises a pin and the news travels.</text><rect x="22" y="110" width="176" height="54" rx="10" fill="#eeeeee" stroke="#333" stroke-width="2.5"/><text x="110.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Motor + TMC2209</text><line x1="110" y1="164" x2="110" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="225" y="110" width="176" height="54" rx="10" fill="#dbe9f7" stroke="#333" stroke-width="2.5"/><text x="313.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Pin interrupt</text><line x1="313" y1="164" x2="313" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="428" y="110" width="176" height="54" rx="10" fill="#fff3bf" stroke="#333" stroke-width="2.5"/><text x="516.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Event queue</text><line x1="516" y1="164" x2="516" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="631" y="110" width="176" height="54" rx="10" fill="#fff3bf" stroke="#333" stroke-width="2.5"/><text x="719.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Run loop</text><line x1="719" y1="164" x2="719" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="834" y="110" width="176" height="54" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="922.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Motion policy</text><line x1="922" y1="164" x2="922" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="1037" y="110" width="176" height="54" rx="10" fill="#dff3df" stroke="#333" stroke-width="2.5"/><text x="1125.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Protocol</text><line x1="1125" y1="164" x2="1125" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="1240" y="110" width="176" height="54" rx="10" fill="#fdebd0" stroke="#333" stroke-width="2.5"/><text x="1328.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >owlet client (PC)</text><line x1="1328" y1="164" x2="1328" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="1443" y="110" width="176" height="54" rx="10" fill="#fdebd0" stroke="#333" stroke-width="2.5"/><text x="1531.0" y="143.0" font-size="15" text-anchor="middle" fill="#222" font-weight="bold" >Your app</text><line x1="1531" y1="164" x2="1531" y2="780" stroke="#999" stroke-width="2" stroke-dasharray="6 6"/><rect x="101" y="195" width="18" height="34" fill="#666"/><text x="128" y="217" font-size="14" text-anchor="start" fill="#222" font-weight="normal" >1  shaft blocked: load crosses the stall threshold</text><polyline points="110,277 313,277" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="122" y="267" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >2  DIAG pin goes high</text><polyline points="313,339 516,339" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="325" y="329" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >3  post Stalled(pan)   (a few microseconds, then the interrupt returns)</text><polyline points="516,401 719,401" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="528" y="391" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >4  next loop pass takes it off the queue</text><polyline points="719,463 922,463" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="731" y="453" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >5  deliver to subscribers</text><rect x="913" y="505" width="18" height="34" fill="#666"/><text x="940" y="527" font-size="14" text-anchor="start" fill="#222" font-weight="normal" >6  stop the pan axis, keep the true step count</text><polyline points="719,587 1125,587" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="922.0" y="577" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="bold" >7  deliver to subscribers</text><polyline points="1125,649 1328,649" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="1137" y="639" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >8  $EVT,STALL,PAN   (pushed, not requested)</text><polyline points="1328,711 1531,711" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#ac0392b)"/><text x="1340" y="701" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold" >9  stalled signal fires your handler</text><text x="820" y="800" font-size="15" text-anchor="middle" fill="#333" font-weight="normal" >Steps 2 to 8 take about one loop pass (2 ms). The same path carries limit switches, driver faults and arrivals.</text></svg>